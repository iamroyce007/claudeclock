name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tray]"

      - name: Install macOS front-end
        if: runner.os == 'macOS'
        run: pip install "rumps>=0.4.0"

      # The Tk-backed panel tests skip themselves without a display; give
      # Linux one so they actually run somewhere on CI.
      - name: Start virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 &

      - name: Run tests
        # -v names the test in the log if one hangs; the timeout turns a hang
        # into a normal failure with a traceback instead of a killed job.
        run: pytest -v --timeout=90 --timeout-method=thread

  macos:
    name: macOS .dmg
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[macos]" py2app

      - name: Build .dmg
        env:
          PYTHON: python
        run: ./packaging/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeClock-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tray]" pyinstaller

      - name: Build .exe
        run: pyinstaller --noconfirm packaging/claudeclock.spec

      # Catches missing hidden imports and the certifi bundling problem.
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $out = & ".\dist\ClaudeClock.exe" --diagnose 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "httpx\.Client\s+: OK") {
            Write-Error "bundled executable failed its smoke test"
            exit 1
          }

      # The check above runs the exe FROM a console, so it inherits usable
      # stdout/stderr handles. A double-click from Explorer does not, and the
      # streams are None - which used to kill the app before the tray icon
      # appeared. Start-Process detaches, reproducing the double-click case.
      - name: Start it with no console, as Explorer would
        shell: pwsh
        run: |
          $state = Join-Path $PWD "ci-state"
          $env:CLAUDECLOCK_STATE_DIR = $state
          $env:CLAUDECLOCK_DESKTOP_NOTIFICATIONS = "false"
          $proc = Start-Process -FilePath ".\dist\ClaudeClock.exe" -PassThru
          Start-Sleep -Seconds 30

          if ($proc.HasExited) {
            Write-Host "--- startup.log ---"
            Get-Content (Join-Path $state "startup.log") -ErrorAction SilentlyContinue
            Get-Content (Join-Path $state "monitor.log") -ErrorAction SilentlyContinue
            Write-Error "exe died with no console attached (exit $($proc.ExitCode))"
            exit 1
          }

          $live = Join-Path $state "live.json"
          if (-not (Test-Path $live)) {
            Get-Content (Join-Path $state "monitor.log") -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force
            Write-Error "exe started but never published live.json"
            exit 1
          }

          Write-Host "OK - running with no console, published:"
          Get-Content $live
          Stop-Process -Id $proc.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeClock-windows-exe
          path: dist/ClaudeClock.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ClaudeClock-macos-dmg/*.dmg
            artifacts/ClaudeClock-windows-exe/ClaudeClock.exe
          generate_release_notes: true

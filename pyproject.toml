[project]
name = "windowsill"
version = "1.0.0"
description = "Live monitor for the Claude 5-hour usage window, with automatic session re-arming."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "rich>=13.7",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
# macOS menu bar item (rumps wraps PyObjC; macOS only)
macos = ["rumps>=0.4.0; sys_platform == 'darwin'"]
# Windows taskbar / Linux tray icon
tray = ["pystray>=0.19", "Pillow>=10.0"]
# Everything for this platform, whichever it is
gui = [
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pystray>=0.19; sys_platform != 'darwin'",
    "Pillow>=10.0; sys_platform != 'darwin'",
]

[project.scripts]
sill = "windowsill.cli:main"
windowsill = "windowsill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windowsill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
filterwarnings = ["error::DeprecationWarning:windowsill.*"]
